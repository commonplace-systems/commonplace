name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # THE SCALE LANE'S CLOCK (S-scalelane, 2026-08-18). `:scale` tests are
  # excluded from the default run on purpose (CX-tdkq.9) — but an exclusion
  # needs a place where it still fires, or it outlives its reason. Before
  # this schedule existed, NOTHING ran `--include scale` anywhere: the four
  # perf arms moved to :scale by 1d502586 went from noisy-gate to NO-GATE.
  # Cron is UTC; 06:43 avoids the on-the-hour thundering herd.
  schedule:
    - cron: "43 6 * * *"
  # Manual trigger runs ONLY the scale lane (see job conditions) — it exists
  # so the lane can be exercised without waiting a day for cron.
  workflow_dispatch: {}

# TWO JOBS, DELIBERATELY. They were one until 2026-08-17, and the single job ran
# the cheap format gate BEFORE the expensive test gate — so a formatting slip
# ABORTED the run before a single test executed, and presented as the same red
# dot as a test failure. Two entirely different failures, one indistinguishable
# signal.
#
# That is not a nuisance, it is a masking GENERATOR: it hid a real formatting
# break inside a four-day-old test red on 2026-08-17, and it would keep doing so
# after any repair. Format and tests must be able to fail INDEPENDENTLY and
# report INDEPENDENTLY.
#
# ⛔ Do not re-merge these jobs to save a deps.get.
#
# ⚠️ NOTE FOR WHOEVER ADDS BRANCH PROTECTION: as of 2026-08-17 `main` has NO
# protection rules and NO rulesets, so nothing is keyed to a job name and this
# split broke nothing. If required status checks are ever added, there are now
# TWO jobs to name — `format` and `test` — not one.

jobs:
  format:
    # push/PR only: the scheduled and manual triggers belong to the scale
    # lane, and running the format gate there would attach an unrelated red
    # to it.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-files format gate refuses when either event commit is
          # unavailable; a shallow checkout must never become a zero-file pass.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # apps/commonplace_web/.formatter.exs uses import_deps, so the formatter
      # needs deps fetched even though it compiles nothing.
      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting of pull request files
        if: github.event_name == 'pull_request'
        run: >-
          bin/cp-format-changed
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Check formatting of pushed files
        if: github.event_name == 'push'
        run: bin/cp-format-changed "${{ github.event.before }}" "${{ github.sha }}"

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      YELIXER_REQUIRE_YJS_ORACLE: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # THE POD FENCE SHELLS OUT TO bwrap AND ubuntu-latest DOES NOT SHIP IT.
      #
      # Measured 2026-08-17: CI was 71.2% green over the 66 runs before
      # dfa6fd99 ("Merge the pod fence"), and 0.0% green over the 134 runs
      # after it — not one green run in four days. 100% of those failures were
      # {:error, :bubblewrap_not_found}, first-red and current alike. The
      # binary was simply absent and this workflow never installed it.
      #
      # ⛔ The verify line is not ceremony. The whole reason that red survived
      # four days is that a missing binary reported itself accurately, deep
      # inside a test summary nobody opened. A silent install failure must fail
      # HERE, by name, not 3500 tests later as an unexplained suite red.
      - name: Install bubblewrap (the pod fence requires it)
        # update and install in ONE step on purpose: a separate update step
        # whose failure is tolerated leaves a stale index for the install
        # that follows.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version

      # DIAGNOSTIC ONLY — never a gate. `|| true` on the smoke test is deliberate:
      # the tests are the gate, and a probe that can fail the build is a second
      # gate nobody ratified.
      #
      # WHY THIS EXISTS: the pod fence needs an unprivileged USER namespace
      # (`--unshare-all` implies `--unshare-user`). Ubuntu 23.10+ restricts that
      # by AppArmor policy, and ubuntu-latest is 24.04. The dev host is also
      # 24.04 but has kernel.apparmor_restrict_unprivileged_userns EXPLICITLY
      # SET TO 0 — i.e. relaxed away from the distro default of 1.
      #
      # So "green on host, red in CI" has a candidate cause that is ONE SYSCTL,
      # and this prints it by name rather than leaving it to be inferred from a
      # timeout. If the smoke test fails here, the pod cannot run on this runner
      # and the failing pod tests are a HOST-CAPABILITY question, not a defect.
      - name: Probe sandbox capabilities (diagnostic, never a gate)
        run: |
          . /etc/os-release; echo "os: $PRETTY_NAME"
          for k in kernel.apparmor_restrict_unprivileged_userns \
                   kernel.unprivileged_userns_clone \
                   user.max_user_namespaces; do
            printf '%s = %s\n' "$k" "$(sysctl -n $k 2>/dev/null || echo UNSET)"
          done
          # ⛔ ONE ARM PER NAMESPACE. The first version of this probe was named
          # USERNS_SMOKE and ran `--unshare-all`, which bundles user AND net AND
          # the rest — so its failure was fully explained by a LOOPBACK error
          # with userns never implicated. A name asserting a property nothing
          # enforces, in the one place a mislabel becomes a wrong diagnosis.
          echo "--- bwrap namespace arms, one per namespace ---"
          bwrap --unshare-user --ro-bind / / -- true \
            && echo "NS_USER: OK" || echo "NS_USER: FAILED"
          bwrap --unshare-net  --ro-bind / / -- true \
            && echo "NS_NET: OK"  || echo "NS_NET: FAILED"
          bwrap --unshare-all  --ro-bind / / -- true \
            && echo "NS_ALL: OK"  || echo "NS_ALL: FAILED"


        continue-on-error: true

      # ⛔⛔ THIS STEP CHANGES WHAT bwrap MAY DO. IT IS A POSTURE STEP, NAMED AS ONE.
      #
      # THE FULL SEQUENCE, because a bare "we load an AppArmor profile in CI" is
      # exactly the line a careful person reverts:
      #   · the pod fence needs an unprivileged user namespace; ubuntu-latest
      #     ships apparmor_restrict_unprivileged_userns=1 and bwrap fails outright
      #   · sysctl -w …=0 was measured working and DECLINED by jes ("don't relax
      #     AppArmor")
      #   · THIS approach — a profile granting `userns,` to bwrap alone, the
      #     restriction's own grant mechanism, 93 shipped precedents on the dev
      #     box — was measured working with a restore control, offered, and
      #     APPROVED by jes 2026-08-17 ("if commonplace's idea is safe let's do it").
      #
      # THE SAFETY CASE, each point measured not asserted:
      #   ① the hardening default is untouched — the sysctl is never written
      #   ② the grant names ONE binary; the SCOPE_CONTROL below re-proves it
      #     EVERY RUN by showing an unprofiled copy of bwrap is still denied
      #   ③ bwrap was unconfined before this profile and is unconfined-but-named
      #     after it: flags=(unconfined) confines nothing new and releases
      #     nothing — the ONLY delta is the userns grant
      #   ④ the runner is ephemeral and per-job; the grant dies with the VM
      #
      # ⛔ NOT continue-on-error: if the grant does not take, every pod test
      # after it would fail for a reason unrelated to the code — so this step
      # fails the build ITSELF, by name, at the point of failure.
      - name: Register bwrap under AppArmor's userns grant (posture step, approved by jes 2026-08-17)
        run: |
          BW="$(command -v bwrap)"
          cat > /tmp/bwrap-userns.profile <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap-userns $BW flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /tmp/bwrap-userns.profile
          bwrap --unshare-user --ro-bind / / -- true \
            && echo "GRANT_TOOK: OK" \
            || { echo "GRANT_TOOK: FAILED — pod tests below would fail for a non-code reason"; exit 1; }
          cp "$BW" /tmp/bwrap-unprofiled
          /tmp/bwrap-unprofiled --unshare-user --ro-bind / / -- true \
            && { echo "SCOPE_CONTROL: FAILED — an UNPROFILED binary got a userns; the machine is open"; exit 1; } \
            || echo "SCOPE_CONTROL: OK — the grant names one binary; everything unprofiled stays denied"

      # ARM 4 — the mediator relay's LAST unmeasured dependency: can a process
      # INSIDE the pod's network namespace bind, connect, and echo on
      # 127.0.0.1? The relay design (pod-local TCP → host unix socket) requires
      # exactly this, and nothing else on the board measures it.
      #
      # Runs AFTER the grant step on purpose: without the userns grant this
      # runner cannot create the namespace at all, and the arm would report on
      # the grant rather than on loopback. Read-only: everything happens inside
      # a throwaway namespace. Diagnostic, never a gate.
      - name: Probe pod loopback usability (arm 4, diagnostic)
        continue-on-error: true
        run: |
          bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc -- python3 -c '
          import socket
          s=socket.socket(); s.bind(("127.0.0.1",0)); s.listen(1)
          port=s.getsockname()[1]
          c=socket.socket(); c.connect(("127.0.0.1",port))
          conn,_=s.accept(); c.send(b"x"); assert conn.recv(1)==b"x"
          print("ARM4_LOOPBACK: USABLE (bound, connected, echoed on 127.0.0.1:%d)"%port)
          ' || echo "ARM4_LOOPBACK: UNUSABLE (exit $?)"

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        # Wrapped in cp-test-guard because `mix test` exits 0 when it selects
        # NOTHING — an umbrella app whose path stops matching is silently
        # untested, and nothing in the output says so. --apps is the
        # diagnostic half (a dropped app loses its whole summary line);
        # --min is the backstop. Measured 2026-08-13 after CX-b6mz + CX-71m2:
        # 4137 tests across 5 apps (commonplace 3449, cli 118, bots 276,
        # mcp 158, web 136); yelixer's 390-test app moved to its published repo.
        #
        # If this trips: do NOT lower the numbers to get green. Either an app
        # is being skipped, or the suite legitimately changed — in which case
        # raise them deliberately, in the commit that changed it.
        run: bin/cp-test-guard --min 4100 --apps 5 -- mix test

  # THE SCALE LANE (S-scalelane, 2026-08-18). Runs the :scale-tagged cohort
  # that the default suite deliberately excludes — as of this commit, 11
  # tests: the scale-benchmark module (6), the stranded-detector coverage
  # test (1), and the four perf arms moved by 1d502586 (AuditChokePerf
  # ratios ×3, Compactor 10× ×1). Local run 2026-08-18: ~11.5 minutes.
  # Perf tests cannot be load-robust and still measure performance (the
  # S-timing ruling), so their gate lives HERE, on a scheduled runner, where
  # a scale regression becomes A RED SOMEWHERE rather than a note nowhere.
  #
  # · Its red must not share a dot with anything else's: this job runs ONLY
  #   on schedule/manual dispatch, and format/test run only on push/PR.
  # · No bubblewrap steps: none of the cohort's files touch the pod fence
  #   (grepped 2026-08-18 — bwrap/Pod/sandbox appear in none of them).
  # · :corpus is ALSO excluded by default and deliberately NOT here — its
  #   input is 537 MB of production history that cannot exist in CI; see
  #   corpus_regression_test.exs's moduledoc. Do not "complete" this lane
  #   by adding it.
  # · --min-executed, not --min, carries the floor: in a tag-selected lane
  #   the summary's total counts EXCLUDED tests too, so the plain floor is
  #   blind to the cohort shrinking. `mix test --only` exits 1 only when the
  #   tag matches nothing at all.
  scale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The cohort ran in ~10 minutes locally; a hung benchmark on the default
    # 6-hour job timeout would burn a runner all night on a lane nobody is
    # watching live. Bounded, generously.
    timeout-minutes: 60

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # THE LANE'S OWN DRIFT GATE (boss's review finding, 2026-08-18): the
      # test command below is scoped to apps/commonplace/test, and nothing
      # else enforces that scope. A :scale tag in another umbrella app sits
      # outside the lane — and since only apps/commonplace's test_helper
      # excludes :scale, it would either run in the DEFAULT suite as the
      # noisy gate S-timing removed (apps without the exclusion) or run
      # NOWHERE (apps that add it). Both are the defect this lane exists to
      # end, so either reds the lane by name here. The in-scope count is the
      # positive control: a grep that finds zero tags even in scope is a
      # blind instrument, not a clean tree.
      - name: Refuse :scale tags outside the lane's load scope
        run: |
          IN_SCOPE=$(grep -rl "tag :scale" apps/commonplace/test --include="*.exs" | wc -l)
          if [ "$IN_SCOPE" -eq 0 ]; then
            echo "DRIFT_GATE: BLIND — zero :scale tags found even in scope; the pattern or tree layout changed, fix the gate"; exit 1
          fi
          STRAYS=$(grep -rl "tag :scale" apps/*/test --include="*.exs" | grep -v "^apps/commonplace/test/" || true)
          if [ -n "$STRAYS" ]; then
            echo "DRIFT_GATE: FAILED — :scale tag(s) outside apps/commonplace/test; they run in the default suite as a noisy gate, or nowhere at all — never in this lane:"
            echo "$STRAYS"
            exit 1
          fi
          echo "DRIFT_GATE: OK — ${IN_SCOPE} in-scope file(s), zero strays"

      - name: Run the :scale cohort
        run: >-
          bin/cp-test-guard --min 3000 --min-executed 11 --
          mix test apps/commonplace/test --only scale
