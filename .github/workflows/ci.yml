name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Enforce yelixer boundary
        run: elixir scripts/check_yelixer_commonplace_refs.exs

      - name: Run tests
        # diff_yjs is a developer-only differential test against the JS
        # reference implementation living at a hardcoded local path; it
        # cannot run on a clean CI runner. CX-3mj2 de-hardcodes it and turns
        # it on here, asserting the COUNT that ran rather than an exit code.
        #
        # Wrapped in cp-test-guard because `mix test` exits 0 when it selects
        # NOTHING — an umbrella app whose path stops matching is silently
        # untested, and nothing in the output says so. --apps is the
        # diagnostic half (a dropped app loses its whole summary line);
        # --min is the backstop. Measured 2026-08-08 on main @1e4ae3b:
        # 4263 tests across 6 apps (yelixer 390, commonplace 3215, cli 94,
        # bots 274, mcp 156, web 134).
        #
        # If this trips: do NOT lower the numbers to get green. Either an app
        # is being skipped, or the suite legitimately changed — in which case
        # raise them deliberately, in the commit that changed it.
        run: bin/cp-test-guard --min 4200 --apps 6 -- mix test --exclude diff_yjs
