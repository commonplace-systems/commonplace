name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      YELIXER_REQUIRE_YJS_ORACLE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        # Wrapped in cp-test-guard because `mix test` exits 0 when it selects
        # NOTHING — an umbrella app whose path stops matching is silently
        # untested, and nothing in the output says so. --apps is the
        # diagnostic half (a dropped app loses its whole summary line);
        # --min is the backstop. Measured 2026-08-13 after CX-b6mz + CX-71m2:
        # 4137 tests across 5 apps (commonplace 3449, cli 118, bots 276,
        # mcp 158, web 136); yelixer's 390-test app moved to its published repo.
        #
        # If this trips: do NOT lower the numbers to get green. Either an app
        # is being skipped, or the suite legitimately changed — in which case
        # raise them deliberately, in the commit that changed it.
        run: bin/cp-test-guard --min 4100 --apps 5 -- mix test
