name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# TWO JOBS, DELIBERATELY. They were one until 2026-08-17, and the single job ran
# the cheap format gate BEFORE the expensive test gate — so a formatting slip
# ABORTED the run before a single test executed, and presented as the same red
# dot as a test failure. Two entirely different failures, one indistinguishable
# signal.
#
# That is not a nuisance, it is a masking GENERATOR: it hid a real formatting
# break inside a four-day-old test red on 2026-08-17, and it would keep doing so
# after any repair. Format and tests must be able to fail INDEPENDENTLY and
# report INDEPENDENTLY.
#
# ⛔ Do not re-merge these jobs to save a deps.get.
#
# ⚠️ NOTE FOR WHOEVER ADDS BRANCH PROTECTION: as of 2026-08-17 `main` has NO
# protection rules and NO rulesets, so nothing is keyed to a job name and this
# split broke nothing. If required status checks are ever added, there are now
# TWO jobs to name — `format` and `test` — not one.

jobs:
  format:
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-files format gate refuses when either event commit is
          # unavailable; a shallow checkout must never become a zero-file pass.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # apps/commonplace_web/.formatter.exs uses import_deps, so the formatter
      # needs deps fetched even though it compiles nothing.
      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting of pull request files
        if: github.event_name == 'pull_request'
        run: >-
          bin/cp-format-changed
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Check formatting of pushed files
        if: github.event_name == 'push'
        run: bin/cp-format-changed "${{ github.event.before }}" "${{ github.sha }}"

  test:
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      YELIXER_REQUIRE_YJS_ORACLE: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # THE POD FENCE SHELLS OUT TO bwrap AND ubuntu-latest DOES NOT SHIP IT.
      #
      # Measured 2026-08-17: CI was 71.2% green over the 66 runs before
      # dfa6fd99 ("Merge the pod fence"), and 0.0% green over the 134 runs
      # after it — not one green run in four days. 100% of those failures were
      # {:error, :bubblewrap_not_found}, first-red and current alike. The
      # binary was simply absent and this workflow never installed it.
      #
      # ⛔ The verify line is not ceremony. The whole reason that red survived
      # four days is that a missing binary reported itself accurately, deep
      # inside a test summary nobody opened. A silent install failure must fail
      # HERE, by name, not 3500 tests later as an unexplained suite red.
      - name: Install bubblewrap (the pod fence requires it)
        # update and install in ONE step on purpose: a separate update step
        # whose failure is tolerated leaves a stale index for the install
        # that follows.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version

      # DIAGNOSTIC ONLY — never a gate. `|| true` on the smoke test is deliberate:
      # the tests are the gate, and a probe that can fail the build is a second
      # gate nobody ratified.
      #
      # WHY THIS EXISTS: the pod fence needs an unprivileged USER namespace
      # (`--unshare-all` implies `--unshare-user`). Ubuntu 23.10+ restricts that
      # by AppArmor policy, and ubuntu-latest is 24.04. The dev host is also
      # 24.04 but has kernel.apparmor_restrict_unprivileged_userns EXPLICITLY
      # SET TO 0 — i.e. relaxed away from the distro default of 1.
      #
      # So "green on host, red in CI" has a candidate cause that is ONE SYSCTL,
      # and this prints it by name rather than leaving it to be inferred from a
      # timeout. If the smoke test fails here, the pod cannot run on this runner
      # and the failing pod tests are a HOST-CAPABILITY question, not a defect.
      - name: Probe sandbox capabilities (diagnostic, never a gate)
        run: |
          . /etc/os-release; echo "os: $PRETTY_NAME"
          for k in kernel.apparmor_restrict_unprivileged_userns \
                   kernel.unprivileged_userns_clone \
                   user.max_user_namespaces; do
            printf '%s = %s\n' "$k" "$(sysctl -n $k 2>/dev/null || echo UNSET)"
          done
          # ⛔ ONE ARM PER NAMESPACE. The first version of this probe was named
          # USERNS_SMOKE and ran `--unshare-all`, which bundles user AND net AND
          # the rest — so its failure was fully explained by a LOOPBACK error
          # with userns never implicated. A name asserting a property nothing
          # enforces, in the one place a mislabel becomes a wrong diagnosis.
          echo "--- bwrap namespace arms, one per namespace ---"
          bwrap --unshare-user --ro-bind / / -- true \
            && echo "NS_USER: OK" || echo "NS_USER: FAILED"
          bwrap --unshare-net  --ro-bind / / -- true \
            && echo "NS_NET: OK"  || echo "NS_NET: FAILED"
          bwrap --unshare-all  --ro-bind / / -- true \
            && echo "NS_ALL: OK"  || echo "NS_ALL: FAILED"
        continue-on-error: true

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        # Wrapped in cp-test-guard because `mix test` exits 0 when it selects
        # NOTHING — an umbrella app whose path stops matching is silently
        # untested, and nothing in the output says so. --apps is the
        # diagnostic half (a dropped app loses its whole summary line);
        # --min is the backstop. Measured 2026-08-13 after CX-b6mz + CX-71m2:
        # 4137 tests across 5 apps (commonplace 3449, cli 118, bots 276,
        # mcp 158, web 136); yelixer's 390-test app moved to its published repo.
        #
        # If this trips: do NOT lower the numbers to get green. Either an app
        # is being skipped, or the suite legitimately changed — in which case
        # raise them deliberately, in the commit that changed it.
        run: bin/cp-test-guard --min 4100 --apps 5 -- mix test
